app = "phondo-voice"
primary_region = "syd"

[env]
  PORT = "3001"
  LLM_PROVIDER = "openai"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  # SCRUM-579: scale to zero while idle. The demo warm-up (min_machines_running = 1)
  # pinned a performance-1x/2GB machine up 24/7 at ~$39/mo with no traffic. Fly's
  # proxy autostarts the machine on the inbound Twilio webhook, so the only cost is
  # a few seconds of cold start on the first call after an idle period.
  # Set this back to 1 before pilot calls or a live demo so the first caller
  # doesn't pay that cold start.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"   # 30s startup buffer — prevents transient warn/error during deploys
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
