app = "phondo-voice"
primary_region = "syd"

# SCRUM-579: server.js sets SHUTDOWN_GRACE_MS = 15s to drain active calls, but
# Fly's default kill_timeout is 5s — the drain was being SIGKILLed a third of the
# way through. That only bit on deploys while min_machines_running = 1 made
# autostop unreachable; autostop is now routine, so give the drain room to finish.
kill_timeout = "20s"

[env]
  PORT = "3001"
  LLM_PROVIDER = "openai"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  # SCRUM-579: scale to zero while idle. The demo warm-up (min_machines_running = 1)
  # pinned a performance-1x/2GB machine up 24/7 at ~$39/mo with no traffic. Fly's
  # proxy autostarts the machine on the inbound Twilio webhook and holds the request
  # open while it boots. Measured wakes: ~6s with the image host-cached, but ~14.5s
  # on the FIRST wake after a deploy (the host re-pulls the image).
  #
  # Twilio's read timeout for call HTTP requests is hard-capped at 15s, so that
  # post-deploy wake leaves /twiml almost no budget: the call falls through to the
  # fallback URL and the caller gets voicemail instead of the AI. ALWAYS warm the
  # machine as the last step of a deploy (see docs/runbooks/voice-server.md):
  #   curl -fsS --max-time 30 https://phondo-voice.fly.dev/health
  #
  # Two surfaces wake this machine, not one: inbound Twilio calls AND the PUBLIC
  # /demo page, whose browser WebSocket to /ws/test autostarts it the same way.
  # /demo is live and taking flyer-QR traffic today, so organic marketing visitors
  # already pay a 6-15s "connecting" wait. Set this back to 1 (SCRUM-580) before
  # the first pilot call or the next marketing push, whichever comes first.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"   # 30s startup buffer — prevents transient warn/error during deploys
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  size = "performance-1x"
  memory = "2gb"
